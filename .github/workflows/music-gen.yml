name: Generate music beds (ACE-Step 1.5, CPU)

# Original instrumental music beds from ACE-Step 1.5 (MIT licence, commercial use allowed), DiT-only turbo on CPU.
# One runner per prompt x seed. Results go to the PRIVATE studio release `music-candidates`
# (<prompt>-<seed>.flac + .mp3); music never lands in this public repo, its branches or run artifacts.

on:
  workflow_dispatch:
    inputs:
      prompts:
        description: "Prompt ids from tools/music/prompts.json, comma separated (blank = all)"
        default: ""
      seeds:
        description: "Seeds, comma separated (one runner per prompt x seed)"
        default: "11,23"
      duration:
        description: "Seconds of music per track"
        default: "150"
      steps:
        description: "Diffusion steps (turbo model is trained for 8)"
        default: "8"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env: {PROMPTS: "${{ inputs.prompts }}", SEEDS: "${{ inputs.seeds }}"}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          p = json.load(open("tools/music/prompts.json"))
          ids = [x.strip() for x in os.environ["PROMPTS"].split(",") if x.strip()] or [k for k in p if not k.startswith("_")]
          seeds = [int(s) for s in os.environ["SEEDS"].split(",") if s.strip()]
          print("matrix=" + json.dumps({"include": [{"id": i, "seed": s} for i in ids for s in seeds]}))
          EOF

  generate:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the model
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install ACE-Step 1.5 (CPU)
        run: |
          git clone -q https://github.com/ace-step/ACE-Step-1.5 ace
          git -C ace checkout -q ca1e85fe9430179831e6bc6be790c332190a3866
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q torch==2.10.0 torchaudio==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "transformers>=4.51.0,<4.58.0" "diffusers>=0.37.0" scipy soundfile loguru einops "accelerate>=1.12.0" \
            diskcache numba "vector-quantize-pytorch>=1.27.15" "torchao>=0.16.0,<0.17.0" toml modelscope huggingface_hub \
            python-dotenv matplotlib peft
          pip install -q torchcodec || true
      - name: Write config
        env: {ID: "${{ matrix.id }}", SEED: "${{ matrix.seed }}", DUR: "${{ inputs.duration }}", STEPS: "${{ inputs.steps }}"}
        run: |
          python3 - <<'EOF'
          import json, os, toml
          p = json.load(open("tools/music/prompts.json"))[os.environ["ID"]]
          cfg = {
              "task_type": "text2music", "caption": p["caption"], "lyrics": "[Instrumental]", "instrumental": True,
              "bpm": p.get("bpm"), "keyscale": p.get("keyscale", ""), "duration": float(os.environ["DUR"]),
              "config_path": "acestep-v15-turbo", "inference_steps": int(os.environ["STEPS"]),
              "thinking": False, "use_cot_caption": False, "use_cot_metas": False, "use_cot_language": False, "use_cot_lyrics": False,
              "device": "cpu", "backend": "pt", "batch_size": 1, "seed": int(os.environ["SEED"]), "use_random_seed": False,
              "save_dir": os.path.abspath("out"), "audio_format": "flac", "offload_to_cpu": False, "use_flash_attention": False,
          }
          cfg = {k: v for k, v in cfg.items() if v is not None}
          open("ace/run.toml", "w").write(toml.dumps(cfg))
          print(toml.dumps(cfg))
          EOF
      - name: Generate
        working-directory: ace
        env:
          ACESTEP_INIT_LLM: "false"
          PYTHONPATH: ${{ github.workspace }}/ace
        run: |
          mkdir -p ../out
          start=$(date +%s)
          python cli.py --config run.toml --log-level INFO < /dev/null
          echo "::notice title=Generated ${{ matrix.id }}-${{ matrix.seed }}::$(( $(date +%s) - start )) s on CPU"
          ls -la ../out
      - name: Hand to the studio (private release music-candidates)
        env:
          STUDIO_TOKEN: ${{ secrets.STUDIO_TOKEN }}
          NAME: ${{ matrix.id }}-${{ matrix.seed }}
        run: |
          f=$(find out -type f \( -name '*.flac' -o -name '*.wav' -o -name '*.mp3' \) | head -1)
          [ -n "$f" ] || { echo "::error title=No audio::generation wrote nothing"; exit 1; }
          ffmpeg -loglevel error -y -i "$f" -c:a flac "out/$NAME.flac"
          ffmpeg -loglevel error -y -i "$f" -c:a libmp3lame -b:a 192k "out/$NAME.mp3"
          bash tools/ci/studio.sh release music-candidates "out/$NAME.flac" "out/$NAME.mp3"
