name: Captions (word timestamps)

# Re-times words for an audio file already in the studio (e.g. a spliced v2 narration):
# faster-whisper word timestamps + script-vs-audio check. Results (words.json, check.txt) go to the
# studio previews branch; Claude commits the words.json to episodes/<episode>/audio/ here.
# assemble.yml builds captions.srt from that words.json and the script.

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder name, e.g. p1-refrigerator"
        default: p1-refrigerator
      audio:
        description: "Asset in the studio release narration-<episode>, e.g. final.flac"
        default: final.flac
      text:
        description: "Script text the audio should match"
        default: episodes/p1-refrigerator/script/narration.txt

permissions:
  contents: read

jobs:
  captions:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: tools/requirements-voice.txt}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install -q "faster-whisper>=1.1"
      - name: Fetch audio from the studio
        env: {STUDIO_TOKEN: "${{ secrets.STUDIO_TOKEN }}", EP: "${{ inputs.episode }}", AUDIO: "${{ inputs.audio }}"}
        run: bash tools/ci/studio.sh fetch "narration-$EP" in "$AUDIO"
      - name: Word timestamps and script check
        env: {AUDIO: "${{ inputs.audio }}", TEXT: "${{ inputs.text }}"}
        run: |
          set +e
          mkdir -p out
          base="${AUDIO%.*}"
          python tools/captions/word_timestamps.py "in/$AUDIO" "$TEXT" "out/$base.words.json" | tee out/check.txt
          code=${PIPESTATUS[0]}
          echo "::notice title=Word check::$(head -1 out/check.txt)"
          [ "$code" -eq 2 ] && echo "::warning title=Mismatches::$(tail -n +2 out/check.txt | head -20 | tr '\n' ' ')"
          exit 0
      - name: Hand to the studio (previews)
        env: {STUDIO_TOKEN: "${{ secrets.STUDIO_TOKEN }}", EP: "${{ inputs.episode }}"}
        run: bash tools/ci/studio.sh preview "captions/$EP/run-${{ github.run_id }}" out/*.words.json out/check.txt
